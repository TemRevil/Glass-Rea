# Opens a pull request each week when a GitHub Action or a NuGet package Glass-Rea uses has a newer version;
# CI builds and tests each one. Minor and patch updates come together in one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
