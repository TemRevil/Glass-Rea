# Every push and pull request: builds with warnings as errors, runs the tests, then builds the setup the same way
# the release workflow does (unsigned) and keeps it for a week, so a change that breaks packaging fails here and
# not on release day. The setup is under the run's Artifacts as "Glass-Rea Setup (unsigned)".
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch or pull request replaces a run still going.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: |
          dotnet build GlassRea.slnx -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'The build failed.' }
      - name: Test
        run: |
          dotnet test tests\GlassRea.Tests --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw 'The tests failed.' }
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Test results
          path: TestResults
          retention-days: 7
      - name: Build the setup
        run: scripts\build-setup.ps1 -NoSign
      - name: Keep the setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Glass-Rea Setup (unsigned)
          path: publish/Glass-Rea Setup.exe
          if-no-files-found: error
          retention-days: 7
